---
layout: default
---
<div class="container">
  <a href="{{ '/reisen/' | relative_url }}" class="back-link">&larr; Alle Reisen</a>
  <article>
    <header class="article-header">
      <h1>{{ page.title }}</h1>
      <div class="article-meta">
        {% if page.date %}<span>{{ page.date | date: "%d. %B %Y" }}</span>{% endif %}
        {% if page.country %}<span>{{ page.country }}</span>{% endif %}
        {% if page.duration %}<span>{{ page.duration }}</span>{% endif %}
      </div>
    </header>
    <div class="article-content">
      {{ content }}
    </div>
  </article>
</div>
