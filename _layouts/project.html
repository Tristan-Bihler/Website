---
layout: default
---
<div class="container">
  <a href="{{ '/projekte/' | relative_url }}" class="back-link">&larr; Alle Projekte</a>
  <article>
    <header class="article-header">
      <h1>{{ page.title }}</h1>
      <div class="article-meta">
        {% if page.date %}<span>{{ page.date | date: "%d. %B %Y" }}</span>{% endif %}
        {% if page.status %}<span>Status: {{ page.status }}</span>{% endif %}
        {% if page.tech %}
          <span>
            {% for t in page.tech %}<span class="tag">{{ t }}</span> {% endfor %}
          </span>
        {% endif %}
      </div>
    </header>
    <div class="article-content">
      {{ content }}
    </div>
  </article>
</div>
