<nav class="site-nav">
  <div class="nav-inner">
    <a href="{{ '/' | relative_url }}" class="nav-brand">
      {{ site.title | split: ' ' | first }}<span>.</span>
    </a>
    <button class="nav-toggle" aria-label="Menü öffnen" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'); document.querySelector('.nav-links').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a></li>
      <li><a href="{{ '/projekte/' | relative_url }}"{% if page.url contains '/projekte' %} class="active"{% endif %}>Projekte</a></li>
      <li><a href="{{ '/reisen/' | relative_url }}"{% if page.url contains '/reisen' %} class="active"{% endif %}>Reisen</a></li>
    </ul>
  </div>
</nav>
